name: Deploy to Docker Hub

on:
  pull_request:
    branches:
      - production

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Логин в Docker Hub с использованием токена
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_TOKEN }}

      - name: Установка Buildx
        uses: docker/setup-buildx-action@v3

      - name: Создание тега образа
        run: echo "IMAGE_TAG=$(date +%Y%m%d%H%M%S)" >> $GITHUB_ENV

      - name: Сборка и пуш Docker-образа
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/broteamracing-tg:latest
            ${{ secrets.DOCKER_USERNAME }}/broteamracing-tg:${{ env.IMAGE_TAG }}
          cache-from: type=registry
          cache-to: type=inline
